name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Keep the repo layout so the demo's relative "../packages/*/dist" paths keep working.
      - name: Assemble site
        run: |
          mkdir -p _site/examples _site/packages/light _site/packages/advanced
          cp examples/index.html _site/examples/
          cp -r packages/light/dist _site/packages/light/dist
          cp -r packages/advanced/dist _site/packages/advanced/dist
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=examples/"><a href="examples/">Open the demo</a>' > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
